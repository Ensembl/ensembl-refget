# pyproject.toml -- Ensembl RefGet project configuration

## Generic configuration

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ensembl_refget"
version = "1.0.2"
description = "A refget server"
readme = "README.md"
requires-python = ">= 3.10"
authors = [
    {name = "Ensembl", email = "dev@ensembl.org"},
]
license = {text = "Apache License 2.0"}

# Also will need the tkrzw C++ library with a matching version.
# This needs to be installed separately, e.g.:
# apt-get install libtkrzw-dev
# Tested with
# https://github.com/estraier/tkrzw = 1.0.32
# https://github.com/estraier/tkrzw-python, = 0.1.30
dependencies = [
  "fastapi[standard] >= 0.116.1",
  "cachetools >= 6.1.0",
  "indexed_zstd >= 1.6.1",
  "prometheus-fastapi-instrumentator >= 7.1.0, < 8.0.0",
  "tkrzw@git+https://github.com/estraier/tkrzw-python.git@98c8c7b625266f0bddcd8c6e08c3d838381788c6"
]

[project.optional-dependencies]
test = [
  "pytest",
  "ruff",
  "mypy",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"
log_cli = "true"

[tool.mypy]
mypy_path = "src/stubs"
plugins = "pydantic.mypy"
